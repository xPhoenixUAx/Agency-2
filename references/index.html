<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGNAL — референси</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 Arial,sans-serif;color:#202124;background:#f4f7fb}header{max-width:1440px;margin:auto auto 24px}h1{margin:0 0 8px}select{min-height:44px;padding:8px 12px;border:1px solid #dadce0;border-radius:10px;background:white;font:inherit}label{display:inline-flex;gap:12px;align-items:center;margin:8px 20px 8px 0}a{color:#1967d2}.stage{max-width:1440px;margin:auto;text-align:center}img{display:block;height:auto;width:100%;max-width:1100px;margin:auto;background:white;box-shadow:0 6px 30px #20304012;border-radius:12px}.note{color:#5f6368}body[data-mode^=mobile] img{max-width:480px}body[data-mode=tablet] img{max-width:834px}@media(max-width:600px){body{padding:16px}label{display:flex;flex-direction:column;align-items:stretch;margin-right:0}}</style></head><body data-mode="desktop"><header><h1>SIGNAL — референси</h1><p>Оберіть сторінку та пристрій. Мобільні A і B — послідовні частини однієї сторінки.</p><label>Сторінка<select id="page"><option value="01-home">01 — Home</option><option value="02-google-ads">02 — Google Ads</option><option value="03-tracking">03 — Tracking & Automation</option><option value="04-results">04 — Case Studies</option><option value="05-audit">05 — Free Audit</option></select></label><label>Режим<select id="mode"><option value="desktop">Desktop · 1440</option><option value="tablet">Tablet · 834</option><option value="mobile-a">Mobile · 390 · верх</option><option value="mobile-b">Mobile · 390 · продовження</option></select></label><p><a id="open" href="01-home-desktop.png" target="_blank" rel="noopener">Відкрити зображення окремо</a></p><p class="note">Розміри режимів логічні; роздільна здатність PNG може відрізнятися. Точні вимоги — у MD.</p></header><main class="stage"><img id="reference" src="01-home-desktop.png" alt="Головна — десктопний референс"></main><script>const page=document.getElementById('page'),mode=document.getElementById('mode'),img=document.getElementById('reference'),link=document.getElementById('open');function update(){const name=page.value+'-'+mode.value+'.png';img.src=name;img.alt=page.options[page.selectedIndex].text+' — '+mode.options[mode.selectedIndex].text;link.href=name;document.body.dataset.mode=mode.value;}page.addEventListener('change',update);mode.addEventListener('change',update);</script></body></html>
